# HiRISE -> CTX pipeline config (CLAUDE.md Section 5)
# Stage 0-1 only fields are exercised in this scaffold; later stages read the rest.

manifest: hirise_priority10.csv
detections_root: "C:/Users/brian/Documents/PhD/HiRiseToCTXBoulders/hirise_priority10_detections"
cache_dir: "./cache"
output_dir: "./dataset"

# Target CRS for Stage 1 reprojection.
# Set to the canonical Murray Lab CTX mosaic CRS (IAU 2000 Mars equirectangular,
# sphere 3,396,190 m, central meridian 0). This is the published CTX mosaic CRS per
# Dickson et al. 2018; full programmatic verification against a real tile header is
# deferred to Stage 2 (see DECISIONS.md 2026-05-20 entry on Stage 0.5).
# Sentinel "from_ctx_tile" would trigger the runtime Stage 0.5 probe (src/ctx_retrieve.py).
target_crs: |
  PROJCRS["Mars_2000_Equidistant_Cylindrical",
    BASEGEOGCRS["GCS_Mars_2000",
      DATUM["D_Mars_2000",
        ELLIPSOID["Mars_2000_IAU_IAG",3396190.0,0.0,LENGTHUNIT["metre",1]]],
      PRIMEM["Reference_Meridian",0,ANGLEUNIT["Degree",0.0174532925199433]]],
    CONVERSION["Equidistant Cylindrical (Spherical)",
      METHOD["Equidistant Cylindrical (Spherical)",ID["EPSG",1029]],
      PARAMETER["Latitude of 1st standard parallel",0,ANGLEUNIT["Degree",0.0174532925199433]],
      PARAMETER["Longitude of natural origin",0,ANGLEUNIT["Degree",0.0174532925199433]],
      PARAMETER["False easting",0,LENGTHUNIT["metre",1]],
      PARAMETER["False northing",0,LENGTHUNIT["metre",1]]],
    CS[Cartesian,2],
      AXIS["easting",east,ORDER[1],LENGTHUNIT["metre",1]],
      AXIS["northing",north,ORDER[2],LENGTHUNIT["metre",1]]]

# Murray Lab CTX mosaic access (Stage 2). The actual file naming convention discovered
# 2026-05-20: `https://murray-lab.caltech.edu/CTX/V01/tiles/MurrayLab_GlobalCTXMosaic_V01_{murray_tile}.zip`
# where {murray_tile} uses signed `E{lon}_N{lat}` (e.g. our manifest `W040_N20` ->
# `E-40_N20`; `E152_S08` -> `E152_N-8`). Files are zip-wrapped GeoTIFFs.
ctx_mosaic:
  catalog_url: "https://murray-lab.caltech.edu/CTX/V01/tiles/"
  url_template: "https://murray-lab.caltech.edu/CTX/V01/tiles/MurrayLab_GlobalCTXMosaic_V01_{tile_name}.zip"
  probe_tile: W040_N20            # tile that matches ESP_047976_2020

ctx_read: vsicurl_window          # DEPRECATED 2026-05-22 — superseded by ctx_retrieve.mode below.
                                  # Kept here only because config.py's required-key check predates the move.
hirise_decimation_mpp: 5

ctx_retrieve:
  # Stage 2 retrieval mode. 2026-05-22 decision: download whole zipped CTX tiles to
  # cache/ctx_tiles/ once, then window-read from local. /vsicurl/ + /vsizip/ streaming
  # is not implemented (HiRISE experience showed ~140x slowdown vs bulk download, and
  # parsing zip central directories over HTTP would amplify that). 8 unique tiles for
  # the priority10 manifest -> ~12 GB on disk.
  mode: download_then_window
  buffer_m: 1000              # buffer around polygon-footprint bbox, in CTX CRS metres
  nominal_hirise_width_m: 6000     # used only when shapefile has 0 polygons
  nominal_hirise_length_m: 16000   # (ESP_065711_1545; diversity pick)
  # R74. Small ENCLOSED zero regions in the decimated HiRISE are boulder shadow, not
  # unimaged ground -- HiRISE RDR DN is continuous through 0, so a shadowed pixel is
  # indistinguishable by value from a data gap. Regions no larger than this are re-marked
  # as observed; exterior/edge-connected nodata is untouched because it reaches the array
  # border. Measured shadow holes are 1-2 px (99 % single-pixel), so 16 is ~8x the observed
  # scale and far below any plausible dropout. 0 restores the pre-R74 behaviour. Recorded in
  # the Stage 2 sidecar together with the mask algorithm version and output digest, because
  # a config hash alone cannot tell a pre-R74 mask from a post-R74 one.
  max_interior_hole_px: 16

coregistration:
  enabled: false                  # nominal geolocation first; CLAUDE.md default
  method: phase_correlation_translation
  search_radius_m: 400
  fft_window_px: 256
  # Robust block-median solve (DECISIONS.md 2026-05-28): median of per-block phase
  # correlations with local peak >= block_peak_min; single-window fallback when fewer
  # than min_confident_blocks clear the floor. v1 caches were solved single-window;
  # these only take effect on a re-run.
  block_px: 256
  block_peak_min: 0.5
  min_confident_blocks: 6

labeling:
  grid_anchor: ctx_pixel_origin
  tile_sizes_px: [8, 16, 32, 64]
  label_type: fractional_area
  binary_area_threshold: 0.005
  # 2026-05-27: lowered 5 -> 1 (binary_by_count now means "any boulder by centroid rule").
  # Placeholder 5 was incoherent across scales (impossibly high at 40m, low at 320m) and
  # produced the 5,504/2 area-vs-count disagreement flagged in DECISIONS.md 2026-05-23.
  # scripts/probes/_pick_binary_thresholds.py confirms strict-presence rules agree 90-99%
  # across all scales (Jaccard, area>0 vs count>=1). Two-stage modeling uses
  # `fractional_area > 0` directly (no config dep); binary columns are diagnostic only.
  binary_count_threshold: 1
  categorical_bins: []
  detection_filters:
    min_confidence: null          # `score` column exists (0.10-0.83); leave null. AskUserQuestion 2026-05-26.
    # BoulderNet design floor (Amaro et al. 2026): 5x5 source-image pixels regardless of pixel scale.
    # 5x5 px at 0.25 m/px = 1.5625 m^2; at 0.50 m/px = 6.25 m^2. Global filter chosen 2026-05-26
    # (AskUserQuestion) set to the 0.25 m/px floor (1.5625 m^2 area). _apply_detection_filters uses
    # equivalent-circle diameter: 2*sqrt(1.5625/pi) = 1.4105 m -- the arithmetic is right, but
    # "matches that area threshold exactly" is NOT (corrected 2026-08-06, R80): the floor is
    # applied AFTER Stage 1 reprojects into the clon_0 CTX frame, where area is inflated relative
    # to each image's own standard parallel, so the realised PHYSICAL floor is 1.4105*sqrt(cos phi)
    # = 0.993-1.367 m diameter across the 39 v2 images (median 1.2315), i.e. 3.2-42.0 % looser in
    # diameter and 6.6-101.8 % looser in area than documented. Retained and documented rather than
    # corrected -- see DECISIONS 2026-08-06u and the `realised_size_basis` sidecar block.
    # Nor is the filter a no-op: 19,757 polygons are dropped across the 12 fine (0.25 m/px)
    # images. The 0.50 m/px images ARE unaffected (0 dropped on all 26, verified).
    min_size_m: 1.4105
  # DEPRECATED 2026-05-23: features and context_patch_px moved to top-level `features` block
  # below. Kept here for backwards compat; src/config.py emits a DeprecationWarning if used.
  context_patch_px: null
  features: [intensity_stats, glcm, gradient, shadow_fraction]

# Stage 4b feature extraction (per CLAUDE.md acceptance #4 + PLAN_Stage4b.md):
# Iterates the eligible-tile rows already in dataset/labels/{ObsId}.parquet -- so adding or
# tweaking features re-runs this stage only, in seconds-to-minutes per ObsId. Reads the
# cached CTX windows + masks from Stage 2; no Stage 1-3 dependency beyond what Stage 4
# itself consumed. Decisions locked in via AskUserQuestion 2026-05-23 are noted inline.
features:
  enabled:
    - intensity_stats
    - glcm
    - gradient
    - shadow_fraction
    - lbp
    - lacunarity
    - subtile_variance
    - canny_edges
  glcm:
    # Scale-dependent intensity quantization per Clausi 2002 + PLAN_Stage4b.md §3.2:
    # 8 levels at the finest scale (8 px tiles have only 64 samples), 16 at S=16/S=32,
    # 32 at S=64 (4096 samples can fill a 32x32 matrix meaningfully).
    levels_per_scale: {8: 8, 16: 16, 32: 16, 64: 32}
    # Distance offsets in pixels. S=8 gets only d=1 (a 2-px offset eats 25% of the tile);
    # coarser scales also see d=2 and d=3 which match typical boulder-shadow separation
    # at CTX 5 m/px under realistic sun angles.
    distances_per_scale: {8: [1], 16: [1, 2, 3], 32: [1, 2, 3], 64: [1, 2, 3]}
    angles: [0.0, 0.7853981633974483, 1.5707963267948966, 2.356194490192345]  # 0, pi/4, pi/2, 3pi/4
    angle_average: true            # rotation-invariant; AskUserQuestion 2026-05-23 = recommended
    properties: [contrast, dissimilarity, homogeneity, energy, correlation, ASM]
  gradient:
    sigma: 1.0                     # Gaussian smoothing before Sobel (low-pass; CTX noise rejection)
  shadow_fraction:
    # AskUserQuestion 2026-05-23 = DN-mode + tail offset (more stable than image-percentile).
    # Threshold = mode_DN - shadow_offset_dn; strict variant uses strict_offset_dn; bright
    # variant uses mode_DN + bright_offset_dn. Mode is computed once per image over the
    # HiRISE-mask-covered pixels of the cached CTX window.
    method: dn_mode_offset
    shadow_offset_dn: 20           # mode - 20 DN; "definitely darker than terrain"
    strict_offset_dn: 35           # mode - 35 DN; suppresses dark-terrain false positives
    bright_offset_dn: 30           # mode + 30 DN; sunlit boulder tops
  lbp:
    # AskUserQuestion 2026-05-23 = rotation-invariant uniform LBP (skimage method='uniform').
    # P=8 R=1 -> 10 distinct labels (0..9) -> 10-bin histogram per tile.
    method: uniform
    P: 8
    R: 1
  lacunarity:
    # Gliding-box lacunarity on the shadow mask. Degenerate below ~16 px; emit at S>=32 only.
    box_sizes_px: [2, 4]
    min_tile_size_px: 32
  subtile_variance:
    # Variance of (S/2)-block means within each (S>=16) tile. Captures internal heterogeneity
    # the single-tile std misses; essentially free because reshape-and-reduce already runs.
    min_tile_size_px: 16
  canny_edges:
    # Skimage canny on a per-image basis, then per-tile density + orientation entropy.
    sigma: 1.0
    # R28. The old comment here said "None -> skimage chooses from gradient magnitude",
    # which is the opposite of what happened: with use_quantiles=false, null makes skimage
    # apply its ABSOLUTE constants 0.1 / 0.2 to the img_as_float image, so edge_density
    # partly measured how much radiometric contrast the CTX frame happens to have
    # (Spearman rho = 0.965 against per-image intensity_std across the 38-image cohort,
    # 12.2x spread; a ~3x DN-spread reduction collapsed synthetic edge density 100-fold).
    # These are now PERCENTILES of this frame's own gradient magnitude, which is
    # gain-invariant (same test: x1.00). Brian chose 0.80 / 0.90 on 2026-08-06 -- top 20 %
    # of gradients are edge candidates, top 10 % are seeds -- because it lands mid-range of
    # the pre-fix 0.025-0.307 cohort spread.
    #   * do NOT reuse 0.1 / 0.2 as quantiles: that marks ~80-90 % of pixels as edges.
    #   * an explicit 0.1 with use_quantiles=false is NOT the old behaviour either --
    #     skimage divides explicit absolute thresholds by dtype_max (0.1/255 on uint8).
    # Every edge_* value in dataset*/features/** predates this; see docs/PENDING_REBUILD.md.
    use_quantiles: true
    low_threshold: 0.80
    high_threshold: 0.90
    n_orientation_bins: 8
    min_tile_size_px: 16
  context_patch:
    # AskUserQuestion 2026-05-23 = both 32 and 64 px (CNN baseline is non-optional per
    # PLAN_modeling.md §4). Bundled per (obs_id, patch_size) into a single .npy stack to
    # keep inode count down -- the per-tile {ti}_{tj}.npy layout in PLAN_Stage4b.md §6 would
    # produce ~1.3M tiny files. Feature parquet stores integer indices into the stack;
    # see dataset/DATA_DICTIONARY.md.
    enabled: true
    sizes_px: [32, 64]

# Stage 5 splits + packaging (per CLAUDE.md §4 acceptance #5 + PLAN_Stage5.md).
# Splits are by image (group-aware leave-image-out), never by tile -- tiles within an
# image are spatially correlated and random per-tile splits leak across the boundary.
# Decisions locked in via AskUserQuestion 2026-05-24:
#   - 9-fold LOIO primary + 3-fold balanced secondary
#   - ESP_065711_1545 included in folds with BoulderLabel='unknown'
#   - all.parquet (consolidated view) emitted per scheme
#   - Both in-memory concat (default) and streaming iterator code paths exposed
splits:
  default_scheme: loio_9fold
  schemes:
    loio_9fold:
      n_folds: 9              # true leave-one-image-out; each ObsId is the test set in exactly one fold
      stratification: none    # 1 image per fold; stratification doesn't apply
      seed: 0
    loio_3fold_balanced:
      n_folds: 3
      stratification: boulder_label_size_balanced  # greedy: place each image into the currently-smallest fold within its label group
      seed: 0
    # Stage 5c (PLAN_Stage5c.md, 2026-05-27): within-image 2x2 spatial CV.
    # Diagnostic experiment -- isolates per-image generalisation from the 5 m/px signal
    # floor. 8 non-empty images x 4 quadrants = 32 folds. ESP_065711_1545 excluded
    # (empty truth -> no positives in any quadrant).
    within_image_4fold:
      n_folds: 32
      stratification: within_image
      seed: 0
      n_folds_per_image: 4
      buffer_tiles: 0
      excluded_obs_ids: ["ESP_065711_1545"]
  scale_filter: null          # null = all 4 scales; e.g. [8, 16] to restrict
  emit_all_parquet: true      # consolidated view with fold_idx + split columns

sanity:
  # Stage 0-1 sanity check: reprojected polygon centroid vs manifest CenterLat/CenterLon.
  # > max_km triggers a loud failure. Threshold raised from 2 -> 15 km on 2026-05-20
  # because legitimate detection-footprint asymmetry inside a HiRISE image easily produces
  # 5-10 km offsets (see DECISIONS.md). Multi-hundred-km failures (real data-quality
  # issues in 4 of 10 BoulderNet outputs) still fire loudly under this threshold.
  centroid_max_km: 15.0
