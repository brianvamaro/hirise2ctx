# vClaire v2 DEV config — 5-image fast-iteration subset (PLAN_ModelImprovement.md Phase 0).
# Copy of config_v2.yaml; only the path keys + splits n_folds differ. Reuses the v2 imagery
# + per-image caches via the cache_v2_dev -> cache_v2 junction. Built by
# scripts/probes/_setup_dev_dataset.py. NOT for final results — promote winners to config_v2.yaml.

manifest: hirise_5_dev.csv           # 5 images spanning density (9.6k..727k) + 2 v1-overlap
detections_root: "C:/Users/brian/Documents/PhD/HiRiseToCTXBoulders/hirise_40_vClaire"
cache_dir: "./cache_v2_dev"          # junction -> cache_v2 (shared per-image + imagery caches)
output_dir: "./dataset_v2_dev"

detection_set: "vclaire_5img_dev_ct010_ss256_downscaled_2026-05-29"

# --- everything below copied verbatim from config_v2.yaml ---

target_crs: |
  PROJCRS["Mars_2000_Equidistant_Cylindrical",
    BASEGEOGCRS["GCS_Mars_2000",
      DATUM["D_Mars_2000",
        ELLIPSOID["Mars_2000_IAU_IAG",3396190.0,0.0,LENGTHUNIT["metre",1]]],
      PRIMEM["Reference_Meridian",0,ANGLEUNIT["Degree",0.0174532925199433]]],
    CONVERSION["Equidistant Cylindrical (Spherical)",
      METHOD["Equidistant Cylindrical (Spherical)",ID["EPSG",1029]],
      PARAMETER["Latitude of 1st standard parallel",0,ANGLEUNIT["Degree",0.0174532925199433]],
      PARAMETER["Longitude of natural origin",0,ANGLEUNIT["Degree",0.0174532925199433]],
      PARAMETER["False easting",0,LENGTHUNIT["metre",1]],
      PARAMETER["False northing",0,LENGTHUNIT["metre",1]]],
    CS[Cartesian,2],
      AXIS["easting",east,ORDER[1],LENGTHUNIT["metre",1]],
      AXIS["northing",north,ORDER[2],LENGTHUNIT["metre",1]]]

ctx_mosaic:
  catalog_url: "https://murray-lab.caltech.edu/CTX/V01/tiles/"
  url_template: "https://murray-lab.caltech.edu/CTX/V01/tiles/MurrayLab_GlobalCTXMosaic_V01_{tile_name}.zip"
  probe_tile: W040_N20

ctx_read: vsicurl_window
hirise_decimation_mpp: 5

ctx_retrieve:
  mode: download_then_window
  buffer_m: 1000
  nominal_hirise_width_m: 6000
  nominal_hirise_length_m: 16000

coregistration:
  enabled: false
  method: phase_correlation_translation
  search_radius_m: 400
  fft_window_px: 256
  block_px: 256
  block_peak_min: 0.5
  min_confident_blocks: 6

labeling:
  grid_anchor: ctx_pixel_origin
  tile_sizes_px: [8, 16, 32, 64, 128]   # Phase C: +S128 (640 m) to test if metrics keep rising past S64
  label_type: fractional_area
  binary_area_threshold: 0.005
  binary_count_threshold: 1
  categorical_bins: []
  detection_filters:
    min_confidence: null
    min_size_m: 1.4105
  context_patch_px: null
  features: [intensity_stats, glcm, gradient, shadow_fraction]

features:
  enabled:
    - intensity_stats
    - glcm
    - gradient
    - shadow_fraction
    - lbp
    - lacunarity
    - subtile_variance
    - canny_edges
  glcm:
    levels_per_scale: {8: 8, 16: 16, 32: 16, 64: 32, 128: 32}
    distances_per_scale: {8: [1], 16: [1, 2, 3], 32: [1, 2, 3], 64: [1, 2, 3], 128: [1, 2, 3]}
    angles: [0.0, 0.7853981633974483, 1.5707963267948966, 2.356194490192345]
    angle_average: true
    properties: [contrast, dissimilarity, homogeneity, energy, correlation, ASM]
  gradient:
    sigma: 1.0
  shadow_fraction:
    method: dn_mode_offset
    shadow_offset_dn: 20
    strict_offset_dn: 35
    bright_offset_dn: 30
  lbp:
    method: uniform
    P: 8
    R: 1
  lacunarity:
    box_sizes_px: [2, 4]
    min_tile_size_px: 32
  subtile_variance:
    min_tile_size_px: 16
  canny_edges:
    sigma: 1.0
    low_threshold: null
    high_threshold: null
    n_orientation_bins: 8
    min_tile_size_px: 16
  context_patch:
    # Phase B: enabled on dev to revive the CNN (writes dataset_v2_dev/context_patches
    # + patch_idx_S* columns). sizes 128 added in Phase B.5 if larger context helps.
    enabled: false   # Phase C is GBM-only; patches off to skip the slow regen (Phase B done)
    sizes_px: [32, 64, 128]   # Phase B.5 used P=128 = 640 m wide context

# Dev splits: 5 images -> 5-fold LOIO; within-image 5 x 4 = 20.
splits:
  default_scheme: loio_nfold
  schemes:
    loio_nfold:
      n_folds: 5
      stratification: none
      seed: 0
    within_image_4fold:
      n_folds: 20
      stratification: within_image
      seed: 0
      n_folds_per_image: 4
      buffer_tiles: 0
      excluded_obs_ids: []
  scale_filter: null
  emit_all_parquet: true

sanity:
  centroid_max_km: 15.0
