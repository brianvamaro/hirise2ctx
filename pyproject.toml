[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hirise2ctx"
version = "0.1.0"
description = "HiRISE boulder detections to CTX rock-abundance paired dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that touch real detection files or the network",
]
testpaths = ["tests"]
