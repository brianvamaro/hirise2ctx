[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hirise2ctx"
version = "0.1.0"
description = "HiRISE boulder detections to CTX rock-abundance paired dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "nbconvert>=7.0"]
# Week 3 modeling stack: LightGBM (Tweedie/log1p+Huber GBM baselines) +
# PyTorch CPU (small CNN on context patches). scikit-learn is pulled in for
# GroupKFold (LOIO splits), metric helpers, and the log1p+MSE shadow model.
# pyarrow is already a transitive dep via pandas parquet support; pinned
# explicitly here so the modeling extra is self-contained.
modeling = [
    "lightgbm>=4.0",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that touch real detection files or the network",
]
testpaths = ["tests"]
